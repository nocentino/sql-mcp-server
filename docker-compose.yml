# Shared healthcheck for both SQL Server containers. sqlcmd reads the sa password
# from SQLCMDPASSWORD (set in each service's environment) so it never appears on
# a command line, and -b makes the exit code authoritative — no output parsing.
x-sql-healthcheck: &sql-healthcheck
  test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -l 3 -t 3 -Q 'SELECT 1' >/dev/null 2>&1"]
  interval: 10s
  timeout: 10s
  retries: 10
  start_period: 30s

services:
  # SQL Server 2025 (latest with advanced features)
  sqlserver1:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sql-mcp-sqlserver1
    hostname: sqlserver1
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - SQLCMDPASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
      - MSSQL_ENABLE_HADR=1
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ag-certs:/var/opt/ag-certs
      - ag-backups:/var/opt/mssql/backup
    healthcheck: *sql-healthcheck
    networks:
      - sql-mcp-network
    restart: unless-stopped

  # Initialize ProductsDB, sample data, and the dba_monitor / dab_app accounts.
  # sqlcmd resolves $(MONITOR_PASSWORD) / $(DAB_PASSWORD) in the script from
  # the container environment, so the passwords come from .env, not the SQL.
  # -b fails the container if any batch errors, so a half-applied init cannot
  # satisfy service_completed_successfully.
  sql-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sql-mcp-init
    depends_on:
      sqlserver1:
        condition: service_healthy
    environment:
      - SQLCMDPASSWORD=${SA_PASSWORD}
      - MONITOR_PASSWORD=${MONITOR_PASSWORD}
      - DAB_PASSWORD=${DAB_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    command: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver1", "-U", "sa", "-C", "-b", "-i", "/scripts/ag/init-sqlserver1.sql"]
    networks:
      - sql-mcp-network

  # Data API Builder MCP Server — ProductsDB application access only
  dab-mcp:
    image: mcr.microsoft.com/azure-databases/data-api-builder:2.0.1-rc
    platform: linux/amd64
    container_name: sql-mcp-dab
    hostname: dab-mcp
    environment:
      - MSSQL_CONNECTION_STRING=Server=sqlserver1,1433;Database=${SQL_DATABASE:-ProductsDB};User ID=dab_app;Password=${DAB_PASSWORD};Encrypt=false;TrustServerCertificate=true;
    ports:
      - "5001:5000"
    volumes:
      - ./dab-config.json:/App/dab-config.json:ro
    depends_on:
      sql-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sql-mcp-network
    restart: unless-stopped

  # Second SQL Server 2025 instance — used for multi-instance testing
  sqlserver2:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sql-mcp-sqlserver2
    hostname: sqlserver2
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${SA_PASSWORD}
      - SQLCMDPASSWORD=${SA_PASSWORD}
      - MSSQL_PID=Developer
      - MSSQL_ENABLE_HADR=1
    ports:
      - "1434:1433"
    volumes:
      - ag-certs:/var/opt/ag-certs
      - ag-backups:/var/opt/mssql/backup
    healthcheck: *sql-healthcheck
    networks:
      - sql-mcp-network
    restart: unless-stopped

  # Create dba_monitor on sqlserver2 (mirrors the account on sqlserver1)
  sql-init-sqlserver2:
    image: mcr.microsoft.com/mssql/server:2025-latest
    platform: linux/amd64
    container_name: sql-mcp-init-sqlserver2
    depends_on:
      sqlserver2:
        condition: service_healthy
    environment:
      - SQLCMDPASSWORD=${SA_PASSWORD}
      - MONITOR_PASSWORD=${MONITOR_PASSWORD}
    volumes:
      - ./scripts:/scripts:ro
    command: ["/opt/mssql-tools18/bin/sqlcmd", "-S", "sqlserver2", "-U", "sa", "-C", "-b", "-i", "/scripts/ag/init-sqlserver2.sql"]
    networks:
      - sql-mcp-network

  # SQL Server DBA MCP Server — read-only DMV access for agent-driven monitoring.
  # Receives only INSTANCES: this container talks to the agent, so it should not
  # hold the sa or dab_app passwords.
  sql-mcp-server:
    build: ./sql-mcp-server
    container_name: sql-mcp-dba
    environment:
      - INSTANCES=${INSTANCES}
    ports:
      - "3001:3000"
    depends_on:
      sql-init:
        condition: service_completed_successfully
      sql-init-sqlserver2:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - sql-mcp-network
    restart: unless-stopped

volumes:
  sql-data:
    driver: local
  ag-certs:
    driver: local
  ag-backups:
    driver: local

networks:
  sql-mcp-network:
    driver: bridge
